# ruff 配置：本插件的过滤逻辑刻意使用宽泛的异常捕获做兜底，
# 保证任何异常都不会影响机器人正常回复，因此这里关闭对应的规则。
line-length = 96
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    # 过滤逻辑必须"出错即放行"，宽泛捕获是有意为之
    "BLE001",
    "S110",
    "S112",
    # 插件入口的导入顺序受 AstrBot 约定约束
    "E402",
    # 代码注释使用中文全角标点，RUF003 的提示不适用
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S311", "E402", "RUF100"]
